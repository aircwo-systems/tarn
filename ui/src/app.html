<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Tarn dashboard for monitoring local AWS emulation resources"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0f14" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafb" />
    <script>
      (function () {
        var cookieName = "tarn-ui-settings=";
        var cookieValue = null;
        var parts = document.cookie.split("; ");
        for (var i = 0; i < parts.length; i++) {
          if (parts[i].indexOf(cookieName) === 0) {
            cookieValue = parts[i].slice(cookieName.length);
            break;
          }
        }

        var mode = "system";
        if (cookieValue) {
          try {
            var parsed = JSON.parse(decodeURIComponent(cookieValue));
            if (
              parsed &&
              (parsed.themeMode === "light" ||
                parsed.themeMode === "dark" ||
                parsed.themeMode === "system")
            ) {
              mode = parsed.themeMode;
            }
          } catch (_) {}
        }

        var resolved = mode;
        if (mode === "system") {
          resolved =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }

        if (resolved === "light") {
          document.documentElement.classList.add("light");
          document.documentElement.classList.remove("dark");
        } else {
          document.documentElement.classList.add("dark");
          document.documentElement.classList.remove("light");
        }

        // Override theme-color meta to match the user's persisted choice
        // rather than just the OS preference, so Safari chrome tracks the app.
        if (mode !== "system") {
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          var color = resolved === "dark" ? "#0a0f14" : "#f8fafb";
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute("content", color);
          }
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
