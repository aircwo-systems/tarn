name: CI

on:
  push:
    branches: [main, develop-mvp]
  pull_request:
    branches: [main, develop-mvp]

jobs:
  go-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build openstack
        run: go build -o ./build/openstack ./cmd/openstack

      - name: Build secrets-proxy
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o ./build/secrets-proxy-linux ./cmd/secrets-proxy

      - name: Test
        run: go test ./... -v -race -count=1 -short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.10.1

  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Type check UI
        working-directory: ui
        run: bun run check

      - name: Build UI
        working-directory: ui
        run: bun run build
