name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Build UI
        working-directory: ui
        run: bun run build

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/build/

  build-binaries:
    needs: build-ui
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - name: Download UI Dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: internal/api/ui-dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build tarn
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          CGO_ENABLED=0 go build \
            -ldflags="-s -w -X github.com/aircwo-systems/tarn/internal/cli.version=${{ github.ref_name }}" \
            -o ./build/tarn-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} \
            ./cmd/tarn

      - name: Build secrets-proxy (linux/amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          CGO_ENABLED=0 go build \
            -ldflags="-s -w" \
            -o ./build/secrets-proxy-linux-amd64 \
            ./cmd/secrets-proxy

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-tarn-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./build/tarn-*

      - name: Upload secrets-proxy artifact
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: secrets-proxy-linux-amd64
          path: ./build/secrets-proxy-*

  create-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download Binaries
        uses: actions/download-artifact@v4
        with:
          path: ./raw-bins
          merge-multiple: true
      
      - name: Package Release
        run: |
          mkdir ./to-upload
          for f in ./raw-bins/tarn-*; do
            name=$(basename "$f")
            if [[ "$name" == *.exe ]]; then
              zip "./to-upload/${name%.exe}.zip" "$f"
            else
              tar -czvf "./to-upload/${name}.tar.gz" "$f"
            fi
          done
          if [ -f ./raw-bins/secrets-proxy-linux-amd64 ]; then
            tar -czvf "./to-upload/secrets-proxy-linux-amd64.tar.gz" ./raw-bins/secrets-proxy-linux-amd64
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./to-upload/*
          generate_release_notes: true
